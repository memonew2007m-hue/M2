<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو مطعم سمسمه | Simsimah Restaurant</title>
    <!-- PWA Web App Meta -->
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href='data:application/manifest+json,{"name":"مطعم سمسمه","short_name":"سمسمه","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#ffd700","icons":[{"src":"https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=192&q=80","sizes":"192x192","type":"image/jpeg"}]}'>
    
    <!-- خط القاهرة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-card: #fdfdfd;
            --bg-nav: rgba(255, 255, 255, 0.96);
            --text-main: #111827;
            --text-muted: #6b7280;
            --yellow-bright: #ffea00;
            --yellow-glow: #ffd700;
            --border-color: rgba(255, 215, 0, 0.6);
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .dark {
            --bg-primary: #050505;
            --bg-card: #121212;
            --bg-nav: rgba(10, 10, 10, 0.95);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --yellow-bright: #ffea00;
            --yellow-glow: #ffd700;
            --border-color: rgba(255, 215, 0, 0.4);
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        }

        /* تحريك التوهج بالأصفر الساطع */
        @keyframes yellowGlowPulse {
            0% {
                box-shadow: 0 0 8px #ffd700, 0 0 15px rgba(255, 234, 0, 0.4);
                border-color: #ffd700;
            }
            50% {
                box-shadow: 0 0 22px #ffea00, 0 0 35px rgba(255, 215, 0, 0.8);
                border-color: #ffea00;
            }
            100% {
                box-shadow: 0 0 8px #ffd700, 0 0 15px rgba(255, 234, 0, 0.4);
                border-color: #ffd700;
            }
        }

        @keyframes animatedGlowBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding-bottom: 90px;
            min-height: 100vh;
        }

        header {
            background: var(--bg-nav);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--yellow-glow);
            padding: 10px 15px;
            animation: yellowGlowPulse 3s infinite ease-in-out;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(45deg, #ffd700, #ffea00, #ffae00);
            background-size: 200% 200%;
            animation: animatedGlowBackground 3s infinite alternate;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 20px;
            box-shadow: 0 0 15px var(--yellow-glow);
            overflow: hidden;
            border: 2px solid #ffffff;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-title h1 {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1.1;
        }

        .brand-title p {
            font-size: 0.72rem;
            color: #d4a000;
            font-weight: 800;
        }

        .theme-toggle-btn {
            background: rgba(255, 215, 0, 0.2);
            border: 1.5px solid var(--yellow-glow);
            color: #856404;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            animation: yellowGlowPulse 2.5s infinite;
        }

        .info-bar {
            max-width: 800px;
            margin: 10px auto 5px auto;
            padding: 0 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .map-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(90deg, #ffd700, #ffea00);
            color: #000;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 900;
            animation: yellowGlowPulse 2s infinite ease-in-out;
        }

        .social-links {
            display: flex;
            gap: 6px;
        }

        .social-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background: var(--bg-card);
            border: 1.5px solid var(--yellow-glow);
            text-decoration: none;
            font-size: 14px;
        }

        .search-container {
            max-width: 800px;
            margin: 12px auto;
            padding: 0 12px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 10px 38px 10px 14px;
            border-radius: 25px;
            border: 2px solid var(--yellow-glow);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            animation: yellowGlowPulse 4s infinite;
        }

        .search-box i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #d4a000;
            font-size: 0.9rem;
        }

        .categories-container {
            position: sticky;
            top: 65px;
            z-index: 90;
            background: var(--bg-nav);
            backdrop-filter: blur(8px);
            max-width: 800px;
            margin: 6px auto;
            padding: 8px 12px;
            border-bottom: 2px solid var(--yellow-glow);
        }

        .categories-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .categories-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1.5px solid var(--yellow-glow);
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .tab-btn.active {
            background: linear-gradient(90deg, #ffd700, #ffea00);
            color: #000;
            border-color: #ffea00;
            animation: yellowGlowPulse 1.5s infinite;
        }

        .menu-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 12px;
        }

        /* الفاصل المربع الكبير للأقسام بداخل الشعار المتوهج */
        .square-section-divider {
            margin: 40px 0 25px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .square-divider-card {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1.2 / 1;
            background: var(--bg-card);
            border: 3px solid var(--yellow-glow);
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            animation: yellowGlowPulse 2s infinite ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .square-divider-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 234, 0, 0.15) 0%, transparent 70%);
            animation: animatedGlowBackground 4s infinite linear;
        }

        .square-icon-box {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ffd700, #ffea00);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 34px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
            border: 2px solid #ffffff;
            z-index: 2;
        }

        .square-divider-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--text-main);
            z-index: 2;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .menu-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 600px) {
            .menu-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .dish-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .dish-card:hover {
            animation: yellowGlowPulse 1.5s infinite;
        }

        .dish-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }

        .dish-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .dish-title {
            font-size: 0.88rem;
            font-weight: 800;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dish-desc {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            line-height: 1.25;
            height: 2.5em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .dish-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .dish-price {
            font-size: 0.85rem;
            font-weight: 900;
            color: #d4a000;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid var(--yellow-glow);
            border-radius: 15px;
            padding: 2px;
            gap: 4px;
        }

        .qty-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: #ffd700;
            color: #000;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-number {
            font-weight: 800;
            font-size: 0.8rem;
            min-width: 16px;
            text-align: center;
        }

        /* السلة المضيئة المتوهجة باللون الأصفر */
        .cart-bar {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 760px;
            background: var(--bg-nav);
            border: 2px solid #ffea00;
            animation: yellowGlowPulse 2s infinite ease-in-out;
            border-radius: 18px;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 99;
            backdrop-filter: blur(12px);
        }

        .cart-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-icon-wrap {
            position: relative;
            background: linear-gradient(45deg, #ffd700, #ffea00);
            color: #000;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 0 10px #ffd700;
        }

        .cart-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e60000;
            color: white;
            font-size: 0.65rem;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-total-title {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .cart-total-price {
            font-size: 0.95rem;
            font-weight: 900;
            color: #d4a000;
        }

        .send-order-btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 3px 12px rgba(37, 211, 102, 0.4);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 2px solid #ffea00;
            animation: yellowGlowPulse 3s infinite;
            width: 100%;
            max-width: 420px;
            border-radius: 18px;
            padding: 16px;
            box-shadow: var(--shadow);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--yellow-glow);
            padding-bottom: 8px;
            font-size: 0.95rem;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
        }

        .order-summary-item {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            border-bottom: 1px dashed var(--yellow-glow);
            font-size: 0.82rem;
        }

        .order-type-selector {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .type-btn {
            flex: 1;
            padding: 8px;
            border: 1.5px solid var(--yellow-glow);
            background: var(--bg-primary);
            color: var(--text-muted);
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .type-btn.active {
            border-color: #ffea00;
            background: rgba(255, 215, 0, 0.25);
            color: #d4a000;
            font-weight: 800;
            animation: yellowGlowPulse 2s infinite;
        }

        .input-group {
            margin-top: 10px;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 8px 10px;
            background: var(--bg-primary);
            border: 1.5px solid var(--yellow-glow);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.82rem;
            outline: none;
        }

        .submit-whatsapp-btn {
            width: 100%;
            margin-top: 15px;
            background: #25d366;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="header-top">
            <div class="brand">
                <div class="logo-icon">
                    <img src="IMG_2408.jpeg" alt="لوجو مطعم سمسمه" onerror="this.style.display='none'">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div class="brand-title">
                    <h1>مطعم سمسمه</h1>
                    <p>أشهى المأكولات والمشويات العراقية</p>
                </div>
            </div>
            <div class="controls">
                <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()" title="تغيير النمط">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </div>

        <div class="info-bar">
            <a href="https://maps.google.com" target="_blank" class="map-btn">
                <i class="fa-solid fa-location-dot"></i>
                الموقع على الخريطة
            </a>
            <div class="social-links">
                <a href="https://t.me/" target="_blank" class="social-btn" title="تلجرام"><i class="fa-brands fa-telegram"></i></a>
                <a href="https://instagram.com/" target="_blank" class="social-btn" title="انستغرام"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://facebook.com/" target="_blank" class="social-btn" title="فيسبوك"><i class="fa-brands fa-facebook-f"></i></a>
            </div>
        </div>
    </header>

    <!-- حقل البحث -->
    <div class="search-container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن طبق، حلى، أو مشروب..." oninput="handleSearch()">
        </div>
    </div>

    <!-- تبويبات الأقسام -->
    <div class="categories-container">
        <div class="categories-tabs" id="categoriesTabs"></div>
    </div>

    <!-- غلاف الأطباق الكامل -->
    <div class="menu-wrapper" id="menuWrapper"></div>

    <!-- شريط السلة السفلي المتوهج -->
    <div class="cart-bar" id="cartBar">
        <div class="cart-info">
            <div class="cart-icon-wrap">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </div>
            <div>
                <div class="cart-total-title">المجموع الكلي</div>
                <div class="cart-total-price" id="cartTotalPrice">0 د.ع</div>
            </div>
        </div>
        <button class="send-order-btn" onclick="openOrderModal()">
            <i class="fa-brands fa-whatsapp"></i> إرسال الطلب
        </button>
    </div>

    <!-- نافذة المودال -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-receipt"></i> تفاصيل الطلب</h3>
                <button class="close-modal" onclick="closeOrderModal()">&times;</button>
            </div>
            
            <div id="modalOrderItems"></div>

            <div class="input-group">
                <label>نوع الطلب:</label>
                <div class="order-type-selector">
                    <button class="type-btn active" id="btn-dinein" onclick="setOrderType('dinein')">
                        <i class="fa-solid fa-utensils"></i> داخل المطعم
                    </button>
                    <button class="type-btn" id="btn-takeaway" onclick="setOrderType('takeaway')">
                        <i class="fa-solid fa-bag-shopping"></i> سفري
                    </button>
                    <button class="type-btn" id="btn-delivery" onclick="setOrderType('delivery')">
                        <i class="fa-solid fa-motorcycle"></i> توصيل
                    </button>
                </div>
            </div>

            <div class="input-group" id="deliveryGroup" style="display: none;">
                <label for="deliveryZone">منطقة التوصيل:</label>
                <select id="deliveryZone" onchange="updateModalTotal()">
                    <option value="2000">مركز المدينة (الديوانية) - 2,000 د.ع</option>
                    <option value="3000">الأحياء المجاورة - 3,000 د.ع</option>
                    <option value="5000">أطراف المدينة / المناطق البعيدة - 5,000 د.ع</option>
                </select>
            </div>

            <div class="input-group">
                <label for="tableName" id="tableLabel">رقم الطاولة:</label>
                <input type="text" id="tableName" placeholder="مثال: طاولة 5">
            </div>

            <div class="input-group">
                <label for="orderNotes">ملاحظات إضافية:</label>
                <textarea id="orderNotes" rows="2" placeholder="مثال: بدون بصل، زيادة صوص..."></textarea>
            </div>

            <button class="submit-whatsapp-btn" onclick="sendToWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> إرسال المباشر للكاشير
            </button>
        </div>
    </div>

    <script>
        const GOOGLE_SHEETS_JSON_URL = ""; 

        const categoriesConfig = [
            { id: "grills", title: "قسم المشويات", icon: "fa-fire-burner" },
            { id: "appetizers", title: "قسم المقبلات", icon: "fa-bowl-food" },
            { id: "desserts", title: "قسم الحلويات", icon: "fa-cake-candles" },
            { id: "icecream", title: "قسم الآيس كريم", icon: "fa-ice-cream" },
            { id: "drinks", title: "قسم المشروبات", icon: "fa-glass-water" }
        ];

        let menuData = [
            // المشويات
            { id: 1, name: "كباب عراقي فاخر", category: "grills", price: 14000, desc: "لحم غنم بلدي مع الخضار المشوية والخبز الحار", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500&q=80" },
            { id: 2, name: "تكه لحم غنم", category: "grills", price: 16000, desc: "قطع لحم الغنم الطرية المشوية على الفحم", img: "https://images.unsplash.com/photo-1544025162-d76694265947?w=500&q=80" },

            // المقبلات
            { id: 5, name: "حمص بطحينة باللحم", category: "appetizers", price: 5000, desc: "حمص ناعم مع زيت الزيتون وقطع اللحم المحمّر", img: "https://images.unsplash.com/photo-1577906096429-f73c2c312435?w=500&q=80" },

            { id: 7, name: "تبولة لبنانية", category: "appetizers", price: 4000, desc: "بقدونس طازج، برغل، طماطم، زيت زيتون وليمون", img: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500&q=80" },

            // الحلويات
            { id: 12, name: "كنافة بالجبنة النابلسية", category: "desserts", price: 6000, desc: "كنافة ساخنة مقرمشة بالجبنة الذائبة والفستق الحلبي", img: "https://images.unsplash.com/photo-1579372786545-d24232daf58c?w=500&q=80" },
            { id: 13, name: "بقلاوة مشكلة بالفستق", category: "desserts", price: 7000, desc: "قطع بقلاوة هشة غنية بالفستق الحلبي والقطر", img: "https://images.unsplash.com/photo-1519676867240-f03562e64548?w=500&q=80" },

            // الآيس كريم
            { id: 15, name: "آيس كريم صنداي الفراولة", category: "icecream", price: 4000, desc: "كاسات آيس كريم فانيليا مع قطع الفراولة والصوص", img: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=500&q=80" },
            { id: 16, name: "آيس كريم الفستق والزعفران", category: "icecream", price: 5000, desc: "آيس كريم شرقي طبيعي بطعم الزعفران والفستق", img: "https://images.unsplash.com/photo-1570197788417-0e82375c9371?w=500&q=80" },

            // المشروبات
            { id: 8, name: "عصير برتقال طبيعي", category: "drinks", price: 3000, desc: "برتقال طازج معصور مع كل طلب", img: "https://images.unsplash.com/photo-1613478223719-2ab802602423?w=500&q=80" },
            { id: 9, name: "لبن أربيل بالنعناع", category: "drinks", price: 2000, desc: "لبن مخفوق بارد ومُنعش مع أوراق النعناع", img: "https://images.unsplash.com/photo-1571006682858-a458b8a69388?w=500&q=80" }
        ];

        let cart = {};
        let selectedOrderType = 'dinein';

        async function fetchMenuFromGoogleSheets() {
            if (!GOOGLE_SHEETS_JSON_URL) return;
            try {
                const response = await fetch(GOOGLE_SHEETS_JSON_URL);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.length > 0) {
                        menuData = data;
                        renderUI();
                    }
                }
            } catch (err) {
                console.log("استخدام البيانات المحلية:", err);
            }
        }

        function buildLayout() {
            const tabsContainer = document.getElementById('categoriesTabs');
            const wrapper = document.getElementById('menuWrapper');
            
            tabsContainer.innerHTML = '';
            wrapper.innerHTML = '';

            categoriesConfig.forEach((cat, index) => {
                const tabBtn = document.createElement('button');
                tabBtn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
                tabBtn.id = `tab-${cat.id}`;
                tabBtn.onclick = () => scrollToSection(cat.id);
                tabBtn.innerHTML = `<i class="fa-solid ${cat.icon}"></i> ${cat.title.replace('قسم ', '')}`;
                tabsContainer.appendChild(tabBtn);

                const section = document.createElement('section');
                section.id = `sec-${cat.id}`;
                section.innerHTML = `
                    <div class="square-section-divider">
                        <div class="square-divider-card">
                            <div class="square-icon-box">
                                <i class="fa-solid ${cat.icon}"></i>
                            </div>
                            <div class="square-divider-title">${cat.title}</div>
                        </div>
                    </div>
                    <div class="menu-container" id="grid-${cat.id}"></div>
                `;
                wrapper.appendChild(section);
            });
        }

        function renderAllSections(itemsToRender = null) {
            categoriesConfig.forEach(cat => {
                const gridContainer = document.getElementById(`grid-${cat.id}`);
                if (!gridContainer) return;

                gridContainer.innerHTML = '';
                const items = (itemsToRender || menuData).filter(item => item.category === cat.id);
                
                if(items.length === 0) {
                    gridContainer.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 15px; font-size: 0.8rem; font-weight: 700;">لا توجد عناصر في هذا القسم حالياً</div>`;
                    return;
                }

                items.forEach(dish => {
                    const qty = cart[dish.id] || 0;
                    const card = document.createElement('div');
                    card.className = 'dish-card';
                    card.innerHTML = `
                        <img src="${dish.img}" alt="${dish.name}" class="dish-img">
                        <div class="dish-details">
                            <div>
                                <div class="dish-title">${dish.name}</div>
                                <div class="dish-desc">${dish.desc}</div>
                            </div>
                            <div class="dish-footer">
                                <div class="dish-price">${dish.price.toLocaleString()} د.ع</div>
                                <div class="quantity-control">
                                    <button class="qty-btn" onclick="updateQty(${dish.id}, -1)">-</button>
                                    <span class="qty-number" id="qty-${dish.id}">${qty}</span>
                                    <button class="qty-btn" onclick="updateQty(${dish.id}, 1)">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                    gridContainer.appendChild(card);
                });
            });
        }

        function scrollToSection(catId) {
            const section = document.getElementById(`sec-${catId}`);
            if (section) {
                const yOffset = -120;
                const y = section.getBoundingClientRect().top + window.pageYOffset + yOffset;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }
        }

        window.addEventListener('scroll', () => {
            let current = categoriesConfig[0].id;
            categoriesConfig.forEach(cat => {
                const section = document.getElementById(`sec-${cat.id}`);
                if (section) {
                    const sectionTop = section.offsetTop - 140;
                    if (window.pageYOffset >= sectionTop) {
                        current = cat.id;
                    }
                }
            });
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeTab = document.getElementById(`tab-${current}`);
            if (activeTab) activeTab.classList.add('active');
        });

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (query === '') {
                renderAllSections();
                return;
            }
            const filtered = menuData.filter(dish => 
                dish.name.toLowerCase().includes(query) || 
                dish.desc.toLowerCase().includes(query)
            );
            renderAllSections(filtered);
        }

        function updateQty(dishId, change) {
            if (!cart[dishId]) cart[dishId] = 0;
            cart[dishId] += change;

            if (cart[dishId] <= 0) {
                delete cart[dishId];
            }

            const qtyElements = document.querySelectorAll(`#qty-${dishId}`);
            qtyElements.forEach(el => el.innerText = cart[dishId] || 0);

            updateCartBar();
        }

        function updateCartBar() {
            let totalItems = 0;
            let totalPrice = 0;

            for (const id in cart) {
                const dish = menuData.find(d => d.id == id);
                if (dish) {
                    totalItems += cart[id];
                    totalPrice += dish.price * cart[id];
                }
            }

            document.getElementById('cartBadge').innerText = totalItems;
            document.getElementById('cartTotalPrice').innerText = `${totalPrice.toLocaleString()} د.ع`;
        }

        function setOrderType(type) {
            selectedOrderType = type;
            document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${type}`).classList.add('active');

            const deliveryGroup = document.getElementById('deliveryGroup');
            const tableLabel = document.getElementById('tableLabel');
            const tableNameInput = document.getElementById('tableName');

            if (type === 'delivery') {
                deliveryGroup.style.display = 'block';
                tableLabel.innerText = "العنوان الكامل / رقم الهاتف:";
                tableNameInput.placeholder = "مثال: الحي العصري - قرب جامع الفردوس";
            } else if (type === 'takeaway') {
                deliveryGroup.style.display = 'none';
                tableLabel.innerText = "اسم الزبون / رقم الهاتف:";
                tableNameInput.placeholder = "مثال: أبا الفضل / سفري";
            } else {
                deliveryGroup.style.display = 'none';
                tableLabel.innerText = "رقم الطاولة:";
                tableNameInput.placeholder = "مثال: طاولة 5";
            }

            updateModalTotal();
        }

        function openOrderModal() {
            if (Object.keys(cart).length === 0) {
                alert('الرجاء اختيار طبق واحد على الأقل قبل إرسال الطلب!');
                return;
            }
            document.getElementById('orderModal').classList.add('active');
            updateModalTotal();
        }

        function updateModalTotal() {
            const modalItemsContainer = document.getElementById('modalOrderItems');
            modalItemsContainer.innerHTML = '';
            let itemsTotal = 0;

            for (const id in cart) {
                const dish = menuData.find(d => d.id == id);
                const itemTotal = dish.price * cart[id];
                itemsTotal += itemTotal;

                modalItemsContainer.innerHTML += `
                    <div class="order-summary-item">
                        <span>${dish.name} (x${cart[id]})</span>
                        <span>${itemTotal.toLocaleString()} د.ع</span>
                    </div>
                `;
            }

            let deliveryFee = 0;
            if (selectedOrderType === 'delivery') {
                deliveryFee = parseInt(document.getElementById('deliveryZone').value) || 0;
                modalItemsContainer.innerHTML += `
                    <div class="order-summary-item" style="color: #d4a000; font-weight: bold;">
                        <span>أجور التوصيل:</span>
                        <span>+ ${deliveryFee.toLocaleString()} د.ع</span>
                    </div>
                `;
            }

            const grandTotal = itemsTotal + deliveryFee;

            modalItemsContainer.innerHTML += `
                <div class="order-summary-item" style="font-weight: 900; border-top: 2px solid var(--yellow-glow); margin-top: 10px; padding-top: 10px; font-size: 0.9rem;">
                    <span>المجموع الكلي:</span>
                    <span style="color: #d4a000;">${grandTotal.toLocaleString()} د.ع</span>
                </div>
            `;
        }

        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('active');
        }

        function sendToWhatsApp() {
            const phoneNumber = "9647723681360";
            const tableDetails = document.getElementById('tableName').value.trim() || "غير محدد";
            const orderNotes = document.getElementById('orderNotes').value.trim();

            let typeName = "داخل المطعم";
            if (selectedOrderType === 'takeaway') typeName = "سفري (تجهيز خارجي)";
            if (selectedOrderType === 'delivery') typeName = "توصيل منزل";

            let message = `🍽️ *طلب جديد من مطعم سمسمه*\n`;
            message += `📌 *نوع الطلب:* ${typeName}\n`;
            message += `📍 *التفاصيل/العنوان:* ${tableDetails}\n`;
            message += `----------------------------\n`;
            
            let itemsTotal = 0;
            for (const id in cart) {
                const dish = menuData.find(d => d.id == id);
                const itemTotal = dish.price * cart[id];
                itemsTotal += itemTotal;
                message += `• ${dish.name} × ${cart[id]} = ${itemTotal.toLocaleString()} د.ع\n`;
            }

            let deliveryFee = 0;
            if (selectedOrderType === 'delivery') {
                deliveryFee = parseInt(document.getElementById('deliveryZone').value) || 0;
                message += `• *أجور التوصيل:* ${deliveryFee.toLocaleString()} د.ع\n`;
            }

            const grandTotal = itemsTotal + deliveryFee;

            message += `----------------------------\n`;
            message += `💰 *المجموع الكلي النهائي:* ${grandTotal.toLocaleString()} د.ع\n`;

            if (orderNotes) {
                message += `📝 *ملاحظات:* ${orderNotes}\n`;
            }

            message += `\nشكرًا لتسوقكم من مطعم سمسمه! ❤️`;

            window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');

            if (html.classList.contains('light')) {
                html.classList.remove('light');
                html.classList.add('dark');
                themeIcon.className = 'fa-solid fa-sun';
            } else {
                html.classList.remove('dark');
                html.classList.add('light');
                themeIcon.className = 'fa-solid fa-moon';
            }
        }

        function renderUI() {
            buildLayout();
            renderAllSections();
        }

        renderUI();
        fetchMenuFromGoogleSheets();
    </script>
</body>
</html>
